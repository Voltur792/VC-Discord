name: Platform checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TEST_SYSTEM_SPEECH: '1'
      DVOICE_DATA_DIR: ${{ runner.temp }}/astra-discord-platform-tests
      SPT_INTEGRATION_DIR: ${{ runner.temp }}/astra-discord-platform-tests/integrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux system speech
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/build.mjs --test
      - run: node --test test/*.test.mjs
