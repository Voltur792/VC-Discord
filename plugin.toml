[plugin]
id = "discord-voice-bridge"
name = "Voice communication-Discord"
version = "1.1.0"
description = "Voice conversations, music and participant moderation in Discord; PC commands from the accounts you allow."
author = "Voltur"
license = "MIT"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
ui_contributions = true

[permissions]
send_chat_message = { reason = "Forwards explicitly addressed PC commands only from the Discord accounts you allow to Astra's command chat" }

[platform]
os = ["windows"]
arch = ["x86_64"]

[config]
schema = '{"type":"object","properties":{}}'
